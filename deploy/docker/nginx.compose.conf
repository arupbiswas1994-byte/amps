# Compose variant of nginx.conf — no Ingress layer here, so nginx itself
# proxies the backend routes to keep the app same-origin.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # hashed build assets (index-<hash>.js/.css) are immutable — cache hard
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must NEVER be cached, or a new deploy leaves browsers pointing
    # at a deleted JS bundle (the whole app then fails to load). Always revalidate.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri /index.html;
    }

    location ~ ^/(api|docs|openapi.json|redoc) {
        client_max_body_size 32m;  # bulk CSV imports (register / logbook history)
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
